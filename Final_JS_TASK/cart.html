<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    
    <div class="mx-auto max-w-7xl px-4 py-4">
        <div class="grid grid-cols-6 gap-4 text-center px-5">
            <p class="font-semibold text-[16px]">Product Details</p>
            <p class="font-semibold text-[16px]">Price</p>
            <p class="font-semibold text-[16px]">Quantity</p>
            <p class="font-semibold text-[16px]">Discount</p>
            <p class="font-semibold text-[16px]">Subtotal</p>
            <p class="font-semibold text-[16px]">Action</p>
        </div>

        <div id="cart-item" class="mt-7 px-5">
            <div class="grid grid-cols-6 items-center justify-center gap-6 mb-5 pb-10 border-b border-b-[#BEBCBD]">
                <div class="flex items-center">
                    <img class="w-20 h-24" src="assets/cartimage.png">
                    <div class="items-center">
                        <h1 class="font-bold text-sm">Blue Flower</h1>
                        <p class="text-[#807D7E] text-xs">Color : Yellow</p>
                        <p class="text-[#807D7E] text-xs">Size : M</p>
                    </div>
                </div>
                <p class="font-bold text-sm text-center">$29.00</p>
                <div class="flex items-center justify-center">
                    <div class="flex gap-2 bg-[#F6F6F6] text-sm rounded-xl px-2 py-1">
                        <img class="cursor-pointer w-3" src="assets/minus.svg"><span>2</span><img class="cursor-pointer w-3" src="assets/plus.svg">
                    </div>
                </div>
                <p class="font-bold text-sm text-center">$29.00</p>
                <p class="font-bold text-sm text-center">$29.00</p>
                <div class="flex justify-center">
                    <img class="w-4 cursor-pointer" src="assets/delete.svg">
                </div>
            </div>
        </div>
    </div>

    <div class="mx-auto max-w-7xl px-4 py-4">
        <div id="cart-info" class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <div class="">
                <h1 class="font-semibold text-xl">Discount  Codes</h1>
                <p class="text-[#807D7E] text-xs mt-1">Enter your coupon code if you have one</p>
                <div class="mt-7 flex w-auto">
                    <input type="text" class="w-full sm:w-50 border border-[#BEBCBD] rounded-l-xl py-2 px-4">
                    <button
                        class="font-semibold text-white text-xs bg-[#3BB77E] border border-[#BEBCBD] rounded-r-xl cursor-pointer py-2 px-6 outline-none">Apply
                        Coupon</button>
                </div>
                <button class="font-semibold text-center text-xs border border-[#BEBCBD] rounded-xl py-2 px-4 mt-5 cursor-pointer">Continue Shopping</button>
            </div>

            <div class="max-w-sm bg-[#F4F6FA] px-7 py-5 justify-center">
                <div class="border-b border-b-[#BEBCBD]">
                    <div class="flex justify-between">
                        <span class="font-medium text-sm">Sub Total</span>
                        <span class="font-medium text-sm">$513.00</span>
                    </div>
                    <div class="flex justify-between mt-2">
                        <span class="font-medium text-sm">Shipping</span>
                        <span class="font-medium text-sm">$5.00</span>
                    </div>
                    <div class="flex justify-between mt-5 mb-5">
                        <span class="font-bold text-sm">Grand Total</span>
                        <span class="font-bold text-sm">$518.00</span>
                    </div>
                </div>
                <button class="bg-[#3BB77E] w-full mt-5 rounded-[10px] py-2 px-3 text-white text-xs cursor-pointer">Proceed To Checkout</button>
            </div>
        </div>

    </div>
<script src="index.js"></script>
<script src="product.js"></script>
</body>
</html>
